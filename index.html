<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Api</title>
    <link rel="stylesheet" href="homestyle.css">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<style>
    
</style>
<body>
    <header id="navBar">
        <nav>

            <div class="logo">
                <h2>DUMMY <span>STORE</span></h2>
            </div>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="product.html">Products</a>
                <a href="#">Categories</a>
                <a href="#">Deals</a>
                <button class="mode-control">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="cart.html" class="cart-link">
                    🛒 Cart
                    <span id="cartCount">0</span>
                </a>
            </div>

        </nav>
    </header>

    <section class="hero">

        <div class="hero-content">

            <h1>Discover Amazing Products</h1>

            <p>
                Shop quality products from different categories at affordable prices.
            </p>

            <a href="#productsGrid" class="shop-btn">
                Shop Now
            </a>

        </div>

    </section>

    <section class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >
    </section>

    <section class="category-buttons">
        <button>All</button>
        <button>Beauty</button>
        <button>Furniture</button>
        <button>Fragrances</button>
        <button>Groceries</button>
    </section>

    <div class="product-header">
        <h2>Our Products</h2>

        <a href="product.html" id="productCount" class="product-link">
            Showing 30 Products
        </a>
    </div>

    <div id="productsGrid" class="grid">
        <!-- Display some product fectched like five is good -->
    </div>

    <footer>

        <h3>Dummy Store</h3>

        <p>
            Built with HTML, CSS and JavaScript by Caleb Adelaja.
        </p>

    </footer>
    <!-- <script src="cart.js"></script> -->
     <script>
        const savedTheme = localStorage.getItem('darkMode')
        if(savedTheme === "dark") {
            document.body.classList.add('dark')
        }
     </script>
     <script src="https://kit.fontawesome.com/b2618eae9a.js" crossorigin="anonymous"></script>
</body>
</html>
