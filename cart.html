<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    }

    body{
        font-family:'Barlow Condensed',sans-serif;
        background:#f7f7f7;
        color:#222;
    }

    /* NAVBAR */

    /* header{
        background:white;
        border-bottom:1px solid #ddd;
        padding:18px 40px;
        position:fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        position:sticky;
        top:0;
    } */

    nav{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:18px 7%;
    }

    .logo span{
        color:#4f46e5;
    }

    nav h2{
        font-size:2rem;
    }

    nav a{
        text-decoration:none;
        color:#4f46e5;
        font-size: 1.2rem;
        font-weight:bold;
    }

    /* MAIN */

    main{
        width:90%;
        max-width:1200px;
        margin:40px auto;
    }

    main h1{
        margin-bottom:30px;
    }

    /* CART */

    #cartContainer{
        display:grid;
        grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
        gap:30px;
    }

    /* PRODUCT CARD */

    .product-card{
        background:#fff;
        border-radius:15px;
        padding:20px;
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
        gap:15px;
        box-shadow:0 5px 15px rgba(0,0,0,.08);
    }

    .product-card img{
        width:170px;
        height:170px;
        object-fit:contain;
    }

    .product-info{
        width:100%;
    }


    .product-info h3{
        font-size: 1.3rem;
        margin-bottom:10px;
    }

    .product-info p{
        margin:8px 0;
        color: #666;
    }

    .price{
        font-size:2rem;
        font-weight:bold;
        color:#4f46e5;
    }

    .quantity-box{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin:20px 0;
    }

    .quantity{
        display:flex;
        flex-direction:column;
        align-items:center;
        width:120px;
        font-weight: 700;
        font-size: 1.5rem;
        font-family: Arial, Helvetica, sans-serif;
    }

    .quantity p{
        margin:0;
        font-size:15px;
    }

    .quantity span{
        font-size:22px;
        font-weight:bold;
        font-family: 'Barlow Condensed',sans-serif;
    }

    .plus-btn,
    .minus-btn{
        width:40px;
        height:40px;
        border:none;
        border-radius:8px;
        background:#4f46e5;
        color:white;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor:pointer;
    }

    .remove-btn{
        width:100%;
        padding:12px;
        background:#4f46e5; /* #ef4444 */
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        margin-top:10px;
    }

    .product-card{
        border-bottom:1px solid #ddd;
    }

    #totalPrice{
        margin-top:30px;
        text-align:right;
        font-size:2rem;
        font-weight:bold;
        color:#4f46e5;
        border-top:2px solid #ddd;
        padding-top:20px;
    }

    /* #totalPrice{
        margin-top: 40px;
        padding-top: 20px;
        border-top: 2px solid #ddd;
        text-align: right;
    }

    #totalPrice h2{
        color: #4f46e5;
        font-size: 2rem;
    } */

    /* EMPTY CART */

    .empty-cart{
        background:white;
        text-align:center;
        padding:80px 20px;
        border-radius:15px;
    }

    .empty-cart h2{
        font-size:2.5rem;
        margin-bottom:20px;
    }

    .empty-cart p{
        color:#777;
        margin-bottom:30px;
    }

    .empty-cart a{
        display:inline-block;
        text-decoration:none;
        background:#4f46e5;
        color:white;
        padding:14px 30px;
        border-radius:10px;
    }
</style>
<body>
    <!-- <header>
        <nav>
            <h2>Dummy Cart</h2>
            <a href="index.html">← Continue Shopping</a>
        </nav>
    </header> -->

    <header id="navBar">
        <nav>
            <div class="logo">
                <h2>DUMMY <span>CART</span></h2>
            </div>

            <div class="nav-links">
                <a href="index.html">← Continue Shopping</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Your Cart</h1>

        <div id="cartContainer">
  
        </div>
        <div id="totalPrice"></div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
